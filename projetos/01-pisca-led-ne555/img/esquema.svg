<rect x="50" y="200" width="40" height="80" fill="#fff" stroke="#8b0000" stroke-width="2.2"/>
<path d="M90 220H120" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 260H120" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="192" fill="#8b0000" font-size="15" font-weight="600" text-anchor="middle">J1</text><text x="70" y="226" fill="#8b0000" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="70" y="266" fill="#8b0000" font-size="12" font-weight="600" text-anchor="middle">2</text>
<text x="70" y="300" fill="#1c2333" font-size="12" font-weight="500" text-anchor="middle">borne</text><text x="70" y="314" fill="#1c2333" font-size="12" font-weight="500" text-anchor="middle">2 vias</text>
