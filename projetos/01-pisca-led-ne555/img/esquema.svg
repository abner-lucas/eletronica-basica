<rect x="300" y="140" width="160" height="200" rx="3" fill="#fff8f2" stroke="#8b0000" stroke-width="2.4"/>
<text x="380" y="238" fill="#8b0000" font-size="17" font-weight="600" text-anchor="middle">U1</text><text x="380" y="258" fill="#1c2333" font-size="17" font-weight="600" text-anchor="middle">NE555</text>
<path d="M270 170L300 170" stroke="#8b0000" stroke-width="2.2"/>
