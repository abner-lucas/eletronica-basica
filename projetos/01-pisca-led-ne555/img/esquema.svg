<path d="M340 370V420" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 370V384" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
