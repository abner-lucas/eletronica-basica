<path d="M420 340L420 370" stroke="#8b0000" stroke-width="2.2"/>
<text x="427" y="359" fill="#8b0000" font-size="12" font-weight="500" text-anchor="start">5</text>
<text x="420" y="330" fill="#5b2a2a" font-size="13" font-weight="600" text-anchor="middle">CV</text>
