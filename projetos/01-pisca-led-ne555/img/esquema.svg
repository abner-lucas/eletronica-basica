<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Esquema elétrico do pisca-LED com NE555 em modo astável</title>
<desc id="d">J1 alimenta +5 V e GND. R1 (10 kΩ) liga +5 V ao pino 7. R2 (100 kΩ) liga o pino 7 ao nó dos pinos 2 e 6. C1 (10 µF, positivo no nó 2/6) vai desse nó ao GND. C2 (10 nF) liga o pino 5 ao GND. Pinos 4 e 8 em +5 V, pino 1 em GND. O pino 3 aciona R3 (330 Ω) e o LED1, com o cátodo no GND.</desc>
<defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d6dbe4"/></pattern>
<marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b0000"/></marker></defs>
<rect width="720" height="480" fill="#fff"/><rect width="720" height="480" fill="url(#g)"/>
<!-- alimentação -->
<path d="M120 220V60H420" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 60V40" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 40H284" stroke="#1f3fa6" stroke-width="3"/><text x="270" y="30" fill="#0b5394" font-size="15" font-weight="600" text-anchor="middle">+5V</text>
<path d="M340 60V110" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 60V110" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 260V420H620" fill="none" stroke="#1f3fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M270 420V436M254 436H286M260 443H280M266 450H274" stroke="#1f3fa6" stroke-width="2.6" fill="none"/><text x="270" y="470" fill="#0b5394" font-size="15" font-weight="600" text-anchor="middle">GND</text>
<circle cx="200" cy="60" r="4.5" fill="#1f3fa6"/><circle cx="270" cy="60" r="4.5" fill="#1f3fa6"/><circle cx="340" cy="60" r="4.5" fill="#1f3fa6"/><circle cx="200" cy="420" r="4.5" fill="#1f3fa6"/><circle cx="270" cy="420" r="4.5" fill="#1f3fa6"/><circle cx="340" cy="420" r="4.5" fill="#1f3fa6"/><circle cx="420" cy="420" r="4.5" fill="#1f3fa6"/>
